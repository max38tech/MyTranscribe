name: AutoSupport - Fix

on:
  # Called directly by the triage workflow. This is the path that actually runs in
  # practice: GitHub suppresses workflow triggers for events created with the built-in
  # GITHUB_TOKEN (its guard against workflows retriggering themselves), so the
  # `autosupport:auto-fix` label that triage applies fires nothing at all. Invoking this
  # workflow as a reusable one is what closes that gap, and it needs no extra credential.
  workflow_call:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: string
  # A label applied by a person is a real user event and does trigger normally, so this
  # stays as the manual path: add `autosupport:auto-fix` to an issue by hand.
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: string

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: autosupport-fix-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  fix:
    # workflow_call and workflow_dispatch are both explicit requests to run; only the
    # label event needs filtering, since it fires for every label on every issue.
    if: github.event_name != 'issues' || github.event.label.name == 'autosupport:auto-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Upgrade path (documentation only, not live config) ---------------
      # The step below runs .autosupport/scripts/fix.mjs: a small, patch-based
      # fixer that asks the model for a unified diff and applies it with
      # `git apply`. That is the Level 1 default because it is entirely
      # self-contained - no third-party Action, nothing beyond
      # actions/checkout, Node 20+, and the gh CLI (see SPEC.md section 2 and
      # the PKG-C brief: no invented third-party actions).
      #
      # For a fuller autonomous coding agent (multi-file edits, running your
      # test suite, iterating on failures) you can swap this step for a
      # third-party coding-agent action instead, for example:
      #
      #   - uses: anthropics/claude-code-action@v1
      #     with:
      #       anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      #       prompt: .autosupport/prompts/fix.md
      #
      # Doing so adds a third-party dependency this template does not take
      # by default. Evaluate and pin a version before adopting it.
      # -----------------------------------------------------------------------
      - name: Generate fix
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          # Only the provider matching the configured model id is required; the other is ignored.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .autosupport/scripts/fix.mjs
