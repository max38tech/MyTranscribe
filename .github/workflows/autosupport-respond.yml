name: AutoSupport - Respond

on:
  issues:
    types: [closed, labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: autosupport-respond-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    if: github.event.action == 'closed' || github.event.label.name == 'autosupport:respond'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post reply
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .autosupport/scripts/respond.mjs
