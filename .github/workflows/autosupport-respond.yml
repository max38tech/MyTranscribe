name: AutoSupport - Respond

on:
  issues:
    types: [closed, labeled]
  # Manual re-run for one issue. The issue triggers above carry the issue number in
  # the event payload; a dispatched run has no issue, so it is supplied as an input.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: autosupport-respond-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  respond:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' || github.event.label.name == 'autosupport:respond')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post reply
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .autosupport/scripts/respond.mjs
