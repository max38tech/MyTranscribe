name: AutoSupport - Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: autosupport-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    # Only cost API calls on issues that came through AutoSupport's own
    # forms (both issue forms preset this label) - a stray issue filed some
    # other way is left alone.
    if: contains(github.event.issue.labels.*.name, 'autosupport')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Triage issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .autosupport/scripts/triage.mjs
