version: 1
app:
  id: mytranscribe
  name: MyTranscribe
  repo: max38tech/MyTranscribe
  platforms:
    - windows
    - linux
    - web
model:
  triage: claude-haiku-4-5
  fix: claude-sonnet-5
  respond: claude-haiku-4-5
  chat: claude-haiku-4-5
policy:
  bug:
    auto_fix: true
    auto_pr: true
    require_approval: true
    confidence_floor: 0.8
    labels:
      - bug
      - autosupport
  feature:
    auto_fix: false
    notify_owner: true
    labels:
      - enhancement
      - autosupport
  support:
    chatbot: true
    escalate_after_turns: 3
    confidence_floor: 0.7
    labels:
      - support
      - autosupport
dedup:
  enabled: true
  window_days: 90
reply:
  tone: friendly-concise
  languages:
    - en
